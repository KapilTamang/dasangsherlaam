<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base backdrop: soft, airy, primary as a wash rather than an accent -->
    <radialGradient id="bg-glow-l" cx="30%" cy="38%" r="80%">
      <stop offset="0%" stop-color="oklch(98.5% 0.008 236.969)"/>
      <stop offset="55%" stop-color="oklch(95.142% 0.02512 236.969)"/>
      <stop offset="100%" stop-color="oklch(90% 0.028 236.969)"/>
    </radialGradient>

    <linearGradient id="vignette-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="oklch(70% 0.03 236.969)" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="oklch(70% 0.03 236.969)" stop-opacity="0"/>
      <stop offset="100%" stop-color="oklch(55% 0.05 236.969)" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="line-fade-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="oklch(48% 0.12 236.969)" stop-opacity="0"/>
      <stop offset="50%" stop-color="oklch(48% 0.12 236.969)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="oklch(48% 0.12 236.969)" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="node-core-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(30% 0.09 236.969)"/>
      <stop offset="55%" stop-color="oklch(45% 0.12 236.969)"/>
      <stop offset="100%" stop-color="oklch(45% 0.12 236.969)" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rupture-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(60% 0.14 236.969)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="oklch(60% 0.14 236.969)" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-blur-l" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow-blur-l" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <clipPath id="frame-l">
      <rect x="0" y="0" width="1920" height="1080"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-l)">
    <!-- Base -->
    <rect width="1920" height="1080" fill="url(#bg-glow-l)"/>

    <!-- Ambient primary wash blobs -->
    <circle cx="520" cy="360" r="380" fill="oklch(95.142% 0.02512 236.969)" opacity="0.9" filter="url(#soft-blur-l)"/>
    <circle cx="1560" cy="760" r="320" fill="oklch(92% 0.03 236.969)" opacity="0.8" filter="url(#soft-blur-l)"/>

    <!-- Faint structural grid -->
    <g stroke="oklch(55% 0.05 236.969)" stroke-width="1" opacity="0.12">
      <line x1="0" y1="120" x2="1920" y2="120"/>
      <line x1="0" y1="280" x2="1920" y2="280"/>
      <line x1="0" y1="800" x2="1920" y2="800"/>
      <line x1="0" y1="960" x2="1920" y2="960"/>
      <line x1="160" y1="0" x2="160" y2="1080"/>
      <line x1="1760" y1="0" x2="1760" y2="1080"/>
    </g>

    <!-- Constellation network: nodes + connecting lines -->
    <g stroke="oklch(48% 0.12 236.969)" stroke-width="1.4" opacity="0.5" fill="none">
      <path d="M 120 860 L 300 760 L 470 820 L 640 700"/>
      <path d="M 640 700 L 800 610"/>
      <path d="M 1010 480 L 1180 560 L 1360 470 L 1540 540"/>
      <path d="M 1540 540 L 1720 460"/>
      <path d="M 300 760 L 340 560"/>
      <path d="M 340 560 L 470 400"/>
      <path d="M 1180 560 L 1220 760 L 1420 830"/>
      <path d="M 470 820 L 560 960"/>
      <path d="M 1360 470 L 1400 300"/>
    </g>

    <!-- The rupture: severed link at center, the page's signature moment -->
    <g>
      <line x1="800" y1="610" x2="900" y2="552" stroke="url(#line-fade-l)" stroke-width="1.8" opacity="0.95"/>
      <line x1="960" y1="518" x2="1010" y2="480" stroke="url(#line-fade-l)" stroke-width="1.8" opacity="0.95"/>

      <circle cx="930" cy="535" r="120" fill="url(#rupture-glow-l)"/>

      <g stroke="oklch(40% 0.11 236.969)" stroke-width="2" opacity="0.8" stroke-linecap="round">
        <line x1="900" y1="545" x2="915" y2="522"/>
        <line x1="918" y1="560" x2="936" y2="534"/>
        <line x1="905" y1="500" x2="922" y2="515"/>
        <line x1="944" y1="548" x2="928" y2="568"/>
      </g>
      <g fill="oklch(35% 0.1 236.969)" opacity="0.85">
        <circle cx="912" cy="524" r="2.4"/>
        <circle cx="934" cy="546" r="2"/>
        <circle cx="921" cy="562" r="1.8"/>
        <circle cx="900" cy="546" r="1.6"/>
      </g>
    </g>

    <!-- Network nodes -->
    <g>
      <circle cx="120" cy="860" r="6" fill="url(#node-core-l)"/>
      <circle cx="300" cy="760" r="7" fill="url(#node-core-l)"/>
      <circle cx="470" cy="820" r="5" fill="url(#node-core-l)"/>
      <circle cx="340" cy="560" r="5" fill="url(#node-core-l)"/>
      <circle cx="470" cy="400" r="6" fill="url(#node-core-l)"/>
      <circle cx="640" cy="700" r="8" fill="url(#node-core-l)"/>
      <circle cx="800" cy="610" r="9" fill="url(#node-core-l)"/>
      <circle cx="1010" cy="480" r="9" fill="url(#node-core-l)"/>
      <circle cx="1180" cy="560" r="6" fill="url(#node-core-l)"/>
      <circle cx="1360" cy="470" r="6" fill="url(#node-core-l)"/>
      <circle cx="1540" cy="540" r="5" fill="url(#node-core-l)"/>
      <circle cx="1720" cy="460" r="6" fill="url(#node-core-l)"/>
      <circle cx="1220" cy="760" r="5" fill="url(#node-core-l)"/>
      <circle cx="1420" cy="830" r="5" fill="url(#node-core-l)"/>
      <circle cx="560" cy="960" r="4" fill="url(#node-core-l)"/>
      <circle cx="1400" cy="300" r="4" fill="url(#node-core-l)"/>
    </g>

    <!-- Scattered dust / particles for depth -->
    <g fill="oklch(50% 0.08 236.969)">
      <circle cx="80" cy="200" r="1.6" opacity="0.3"/>
      <circle cx="240" cy="140" r="1.2" opacity="0.25"/>
      <circle cx="1020" cy="120" r="1.6" opacity="0.3"/>
      <circle cx="1680" cy="180" r="1.3" opacity="0.25"/>
      <circle cx="1840" cy="700" r="1.6" opacity="0.3"/>
      <circle cx="1780" cy="920" r="1.2" opacity="0.25"/>
      <circle cx="60" cy="960" r="1.4" opacity="0.25"/>
      <circle cx="760" cy="960" r="1.3" opacity="0.2"/>
      <circle cx="1500" cy="140" r="1.4" opacity="0.25"/>
      <circle cx="380" cy="1000" r="1.2" opacity="0.2"/>
    </g>

    <!-- Subtle center glow to seat foreground text/content -->
    <ellipse cx="960" cy="540" rx="620" ry="360" fill="oklch(95.142% 0.02512 236.969)" opacity="0.5" filter="url(#glow-blur-l)"/>

    <!-- Vignette for legibility -->
    <rect width="1920" height="1080" fill="url(#vignette-l)"/>
  </g>
</svg>
