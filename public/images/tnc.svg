<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a0ecff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a0ecff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(-30,4)">
    <!-- soft depth glow behind the icon only -->
    <circle cx="230" cy="200" r="190" fill="url(#glow)"/>

    <!-- icon: stack of three cards forming an agreement -->
    <g>
      <rect x="150" y="82" width="176" height="222" rx="16" fill="#8bd6ff" transform="rotate(-9 238 193)"/>
      <rect x="118" y="96" width="184" height="230" rx="16" fill="#72bcff" transform="rotate(5 210 211)"/>

      <!-- front document -->
      <g>
        <rect x="94" y="62" width="196" height="248" rx="18" fill="#f4f8ff" stroke="#121b29" stroke-width="2.5"/>
        <!-- folded corner -->
        <path d="M 246 62 L 290 62 L 290 106 Z" fill="#3c83f6"/>
        <path d="M 246 62 L 290 106 L 246 106 Z" fill="#dce9ff"/>
        <!-- text lines -->
        <rect x="118" y="132" width="130" height="9" rx="4.5" fill="#c3d4ea"/>
        <rect x="118" y="156" width="148" height="9" rx="4.5" fill="#c3d4ea"/>
        <rect x="118" y="180" width="110" height="9" rx="4.5" fill="#c3d4ea"/>
        <rect x="118" y="204" width="148" height="9" rx="4.5" fill="#c3d4ea"/>
        <rect x="118" y="228" width="90" height="9" rx="4.5" fill="#c3d4ea"/>
        <!-- signature squiggle -->
        <path d="M 118 268 q 14 -22 28 0 q 14 22 28 0 q 14 -22 28 0 q 14 22 28 0"
              fill="none" stroke="#3c83f6" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- checkmark badge -->
      <circle cx="288" cy="288" r="42" fill="#ffffff"/>
      <circle cx="288" cy="288" r="42" fill="#3c83f6"/>
      <circle cx="288" cy="288" r="42" fill="none" stroke="#121b29" stroke-width="2.5"/>
      <path d="M 268 288 L 282 302 L 310 272" fill="none" stroke="#ffffff" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
